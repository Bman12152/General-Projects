<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111827;
      --line: #dbeafe;
      --text: #e5e7eb;
      --accent: #60a5fa;
      --score: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f2937, var(--bg));
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #gameCanvas {
      background: #050b16;
      border: 4px solid var(--line);
      box-shadow: 0 0 20px rgba(96, 165, 250, 0.2);
      width: 900px;
      height: 520px;
      max-width: 90vw;
      max-height: 70vh;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      width: 900px;
      max-width: 90vw;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--score);
      text-shadow: 0 0 12px rgba(255,255,255,0.3);
    }

    .score {
      min-width: 70px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .scoreboard {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="scoreboard">
      <div class="score" id="playerScore">0</div>
      <div class="score" id="computerScore">0</div>
    </div>

    <canvas id="gameCanvas" width="900" height="520"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");

    const paddleWidth = 16;
    const paddleHeight = 110;
    const paddleSpeed = 7;
    const ballSize = 14;

    const leftPaddle = {
      x: 24,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 0,
      color: "#60a5fa"
    };

    const rightPaddle = {
      x: canvas.width - 24 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5,
      color: "#f87171"
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: ballSize,
      vx: 0,
      vy: 0,
      speed: 6,
      color: "#f8fafc"
    };

    let playerScore = 0;
    let computerScore = 0;

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    const mouse = {
      active: false,
      y: canvas.height / 2
    };

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const randomAngle = (Math.random() * 1.2) - 0.6; // between -0.6 and 0.6 radians
      const speed = ball.speed;

      ball.vx = direction * speed * Math.cos(randomAngle);
      ball.vy = speed * Math.sin(randomAngle);
    }

    function updateScores() {
      playerScoreEl.textContent = playerScore;
      computerScoreEl.textContent = computerScore;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updatePlayerPaddle() {
      // Keyboard controls
      if (keys.ArrowUp) leftPaddle.speed = -paddleSpeed;
      else if (keys.ArrowDown) leftPaddle.speed = paddleSpeed;
      else leftPaddle.speed = 0;

      if (mouse.active) {
        // Mouse position controls the paddle
        leftPaddle.y = mouse.y - leftPaddle.height / 2;
      }

      leftPaddle.y += leftPaddle.speed;
      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    }

    function updateComputerPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      const diff = targetY - rightPaddle.y;
      const maxStep = 5.5;

      if (Math.abs(diff) > 3) {
        rightPaddle.y += Math.sign(diff) * Math.min(Math.abs(diff), maxStep);
      }

      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function wallCollision() {
      if (ball.y - ball.size <= 0) {
        ball.y = ball.size;
        ball.vy *= -1;
      }

      if (ball.y + ball.size >= canvas.height) {
        ball.y = canvas.height - ball.size;
        ball.vy *= -1;
      }
    }

    function paddleCollision() {
      // Left paddle
      if (
        ball.x - ball.size <= leftPaddle.x + leftPaddle.width &&
        ball.x + ball.size >= leftPaddle.x &&
        ball.y + ball.size >= leftPaddle.y &&
        ball.y - ball.size <= leftPaddle.y + leftPaddle.height &&
        ball.vx < 0
      ) {
        const relativeIntersectY = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3); // max 60 degrees
        const speed = Math.hypot(ball.vx, ball.vy) + 0.3;

        ball.x = leftPaddle.x + leftPaddle.width + ball.size;
        ball.vx = Math.cos(bounceAngle) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
      }

      // Right paddle
      if (
        ball.x + ball.size >= rightPaddle.x &&
        ball.x - ball.size <= rightPaddle.x + rightPaddle.width &&
        ball.y + ball.size >= rightPaddle.y &&
        ball.y - ball.size <= rightPaddle.y + rightPaddle.height &&
        ball.vx > 0
      ) {
        const relativeIntersectY = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) + 0.3;

        ball.x = rightPaddle.x - ball.size;
        ball.vx = -Math.cos(bounceAngle) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
      }
    }

    function scoreCheck() {
      if (ball.x + ball.size < 0) {
        computerScore++;
        updateScores();
        resetBall(1);
      }

      if (ball.x - ball.size > canvas.width) {
        playerScore++;
        updateScores();
        resetBall(-1);
      }
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;
    }

    function drawBackground() {
      ctx.fillStyle = "#050b16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = "#dbeafe";
      ctx.setLineDash([18, 16]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = paddle.color;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.fillStyle = ball.color;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      updatePlayerPaddle();
      updateComputerPaddle();
      updateBall();
      wallCollision();
      paddleCollision();
      scoreCheck();

      drawBackground();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", (event) => {
      if (event.key in keys) {
        keys[event.key] = true;
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
      }
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      mouse.y = (event.clientY - rect.top) * scaleY;
      mouse.active = true;
    });

    canvas.addEventListener("mouseleave", () => {
      mouse.active = false;
    });

    updateScores();
    resetBall(Math.random() < 0.5 ? -1 : 1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
